<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Respiration Trace</title>
<meta name="description" content="A breathing pacer that traces box, 4-7-8, and coherent breathing patterns as a live respiratory waveform.">
<meta name="theme-color" content="#1B6E8C">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#EAF2F1;
    --surface:#FFFFFF;
    --surface-alt:#DCEAE8;
    --border:#C3D9D6;
    --text:#12262A;
    --text-muted:#55726F;
    --accent:#1B6E8C;
    --accent-strong:#145469;
    --accent-soft:#D3E7ED;
    --accent-contrast:#FFFFFF;
    --accent-2:#3F8F5F;
    --accent-2-soft:#DCEEE0;
    --shadow: 0 1px 2px rgba(18,38,42,0.06), 0 8px 24px rgba(18,38,42,0.08);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0D1B1D;
      --surface:#14282A;
      --surface-alt:#1B3436;
      --border:#2A484A;
      --text:#E3F1EF;
      --text-muted:#8FADAA;
      --accent:#5FB4D6;
      --accent-strong:#86C9E3;
      --accent-soft:#163540;
      --accent-contrast:#08181C;
      --accent-2:#6FC492;
      --accent-2-soft:#163826;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 28px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0D1B1D;
    --surface:#14282A;
    --surface-alt:#1B3436;
    --border:#2A484A;
    --text:#E3F1EF;
    --text-muted:#8FADAA;
    --accent:#5FB4D6;
    --accent-strong:#86C9E3;
    --accent-soft:#163540;
    --accent-contrast:#08181C;
    --accent-2:#6FC492;
    --accent-2-soft:#163826;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 28px rgba(0,0,0,0.35);
  }

  *{ box-sizing:border-box; }
  [hidden]{ display:none !important; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .page{
    max-width:720px;
    margin:0 auto;
    padding: clamp(28px,6vw,56px) clamp(18px,5vw,28px) 64px;
    display:flex;
    flex-direction:column;
    gap:28px;
  }

  /* ---------- header ---------- */
  header{ display:flex; flex-direction:column; gap:8px; }
  .header-top{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .eyebrow{
    font-size:11px;
    font-weight:600;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--text-muted);
  }
  .theme-toggle{
    appearance:none;
    border:none;
    background:var(--surface-alt);
    color:var(--text-muted);
    width:32px;
    height:32px;
    border-radius:100px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition:color 0.15s ease, background 0.15s ease;
  }
  .theme-toggle:hover{ color:var(--accent); background:var(--accent-soft); }
  .theme-toggle:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .theme-toggle svg{ width:16px; height:16px; }
  .headline-row{
    display:flex;
    align-items:baseline;
    flex-wrap:wrap;
    gap:14px;
    row-gap:6px;
  }
  h1{
    margin:0;
    font-family:"Newsreader", Georgia, "Times New Roman", serif;
    font-style:italic;
    font-weight:500;
    font-size:clamp(1.9rem, 5vw, 2.7rem);
    text-wrap:balance;
    line-height:1.1;
  }
  .ratio-badge{
    font-family:"IBM Plex Mono", ui-monospace, monospace;
    font-variant-numeric:tabular-nums;
    font-size:clamp(1rem,2.6vw,1.25rem);
    font-weight:600;
    letter-spacing:0.02em;
    background:var(--accent-soft);
    color:var(--accent);
    padding:8px 16px;
    border-radius:100px;
    white-space:nowrap;
  }
  .subtext{
    max-width:60ch;
    color:var(--text-muted);
    font-size:0.95rem;
    line-height:1.55;
  }

  /* ---------- tabs ---------- */
  .tabs{
    display:flex;
    gap:6px;
    padding:5px;
    background:var(--surface-alt);
    border-radius:100px;
    width:fit-content;
    max-width:100%;
    overflow-x:auto;
    scrollbar-width:none;
    -webkit-mask-image:linear-gradient(to right, transparent, black 16px, black calc(100% - 16px), transparent);
    mask-image:linear-gradient(to right, transparent, black 16px, black calc(100% - 16px), transparent);
  }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab{
    appearance:none;
    border:none;
    background:transparent;
    color:var(--text-muted);
    font-family:inherit;
    font-size:1rem;
    font-weight:600;
    padding:11px 22px;
    border-radius:100px;
    cursor:pointer;
    white-space:nowrap;
    transition:background 0.15s ease, color 0.15s ease;
  }
  .tab:hover{ color:var(--text); }
  .tab[aria-pressed="true"]{
    background:var(--accent);
    color:var(--accent-contrast);
    box-shadow:var(--shadow);
  }
  .tab:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .session-row{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin-top:-6px;
  }
  .session-label{
    font-size:11px;
    font-weight:600;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--text-muted);
  }
  .tabs-sm{
    display:flex;
    gap:4px;
    padding:3px;
    background:var(--surface-alt);
    border-radius:100px;
    max-width:100%;
    overflow-x:auto;
    scrollbar-width:none;
    -webkit-mask-image:linear-gradient(to right, transparent, black 12px, black calc(100% - 12px), transparent);
    mask-image:linear-gradient(to right, transparent, black 12px, black calc(100% - 12px), transparent);
  }
  .tabs-sm::-webkit-scrollbar{ display:none; }
  .tab-sm{
    appearance:none;
    border:none;
    background:transparent;
    color:var(--text-muted);
    font-family:inherit;
    font-size:0.75rem;
    font-weight:500;
    padding:5px 12px;
    border-radius:100px;
    cursor:pointer;
    transition:background 0.15s ease, color 0.15s ease;
  }
  .tab-sm:hover{ color:var(--text); }
  .tab-sm[aria-pressed="true"]{ background:var(--surface); color:var(--text); }
  .tab-sm:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  /* ---------- custom inputs ---------- */
  .custom-row{
    display:grid;
    grid-template-columns:repeat(4, minmax(0,1fr));
    gap:10px;
  }
  .custom-field{
    display:flex;
    flex-direction:column;
    gap:6px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:10px 12px;
  }
  .custom-field label{
    font-size:10px;
    font-weight:600;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--text-muted);
  }
  .custom-field input{
    font-family:"IBM Plex Mono", ui-monospace, monospace;
    font-size:1.2rem;
    font-variant-numeric:tabular-nums;
    color:var(--text);
    background:transparent;
    border:none;
    width:100%;
    padding:0;
  }
  .custom-field input:focus-visible{ outline:none; }
  .custom-field:focus-within{ border-color:var(--accent); }
  .custom-field input::-webkit-outer-spin-button,
  .custom-field input::-webkit-inner-spin-button{ opacity:0.5; }

  /* ---------- main console ---------- */
  .console{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:20px;
    box-shadow:var(--shadow);
    padding:clamp(18px,4vw,32px);
    display:flex;
    flex-direction:column;
    gap:20px;
  }
  .trace-wrap{ width:100%; }
  svg#trace{ width:100%; height:auto; display:block; overflow:visible; }
  .base-path{ fill:none; stroke:var(--border); stroke-width:1.5; }
  .fill-path{ fill:var(--accent-soft); opacity:0.9; }
  .now-line{ stroke:var(--accent); stroke-width:1; opacity:0.6; }
  .playhead{ fill:var(--accent-strong); filter:drop-shadow(0 0 6px var(--accent-soft)); }
  .pulse-ring{ fill:none; stroke:var(--accent); opacity:0; }
  .pulse-ring.active{ animation:tick-pulse 0.55s cubic-bezier(.25,.7,.4,1); }
  @keyframes tick-pulse{
    from{ r:5.5; stroke-width:2.5; opacity:0.5; }
    to{ r:16; stroke-width:0.5; opacity:0; }
  }
  @media (prefers-reduced-motion: reduce){
    .pulse-ring.active{ animation-duration:0.001s; }
  }
  .countdown-section{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
  }
  .countdown-tile{
    width:fit-content;
    padding:18px 30px;
    border:1.5px solid var(--border);
    border-radius:22px;
    background:var(--surface-alt);
  }
  .countdown{
    display:block;
    font-family:"IBM Plex Mono", monospace;
    font-variant-numeric:tabular-nums;
    font-weight:700;
    font-size:clamp(3rem,11vw,4.2rem);
    line-height:1;
    color:var(--text);
    text-align:center;
  }
  .countdown.pulse{ animation:countdown-pulse 0.32s ease-out; }
  @keyframes countdown-pulse{
    0%{ transform:scale(1.14); opacity:0.75; }
    100%{ transform:scale(1); opacity:1; }
  }
  @media (prefers-reduced-motion: reduce){
    .countdown.pulse{ animation-duration:0.001s; }
  }
  .phase-name{
    font-family:"Newsreader", serif;
    font-style:italic;
    font-weight:600;
    font-size:clamp(1.4rem,4vw,1.8rem);
    color:var(--text);
    text-align:center;
  }
  .phase-name.is-inhale{ color:var(--accent); }
  .phase-name.is-exhale{ color:var(--accent-2); }
  .time-left-row{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:1px;
  }
  .time-left-label{
    font-size:0.7rem;
    font-weight:600;
    letter-spacing:0.09em;
    text-transform:uppercase;
    color:var(--text-muted);
  }
  .session-remaining{
    font-family:"IBM Plex Mono", monospace;
    font-variant-numeric:tabular-nums;
    font-size:clamp(1.3rem,3.4vw,1.6rem);
    font-weight:700;
    color:var(--accent);
    line-height:1.2;
  }

  .controls{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:center; }
  button.primary, button.ghost{
    font-family:"IBM Plex Sans", sans-serif;
    font-size:0.9rem;
    font-weight:600;
    padding:11px 22px;
    border-radius:100px;
    cursor:pointer;
    border:1px solid transparent;
    transition:transform 0.1s ease, opacity 0.15s ease, background 0.15s ease;
  }
  button.primary{
    background:var(--accent);
    color:var(--accent-contrast);
    box-shadow:var(--shadow);
  }
  button.primary:hover{ background:var(--accent-strong); }
  button.primary:active{ transform:scale(0.97); }
  button.ghost{
    background:transparent;
    color:var(--text-muted);
    border-color:var(--border);
  }
  button.ghost:hover{ color:var(--text); border-color:var(--text-muted); }
  button.ghost[aria-pressed="true"]{ color:var(--accent-strong); border-color:var(--accent); }
  button:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  #installBtn{ color:var(--accent); border-color:var(--accent); }
  #installBtn:hover{ background:var(--accent-soft); color:var(--accent); }

  .sound-hint{
    font-size:0.75rem;
    color:var(--text-muted);
    display:flex;
    align-items:center;
    font-family:"IBM Plex Mono", monospace;
    font-variant-numeric:tabular-nums;
  }

  .best-for{
    display:flex;
    align-items:baseline;
    flex-wrap:wrap;
    column-gap:7px;
    row-gap:2px;
    font-family:"IBM Plex Sans", sans-serif;
    font-size:0.85rem;
    line-height:1.4;
  }
  .best-for-label{
    font-size:0.68rem;
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--accent);
    flex-shrink:0;
  }
  .best-for-text{ color:var(--text-muted); }

  @media (prefers-reduced-motion: reduce){
    .tab, button.primary, button.ghost{ transition:none; }
  }

  @media (max-width:420px){
    .custom-row{ grid-template-columns:repeat(2, minmax(0,1fr)); }
  }

  @media (max-width:480px){
    .page{ padding:10px 14px 12px; gap:9px; }
    .eyebrow{ font-size:10px; }
    h1{ font-size:1.5rem; }
    .ratio-badge{ font-size:0.85rem; padding:4px 11px; }
    header{ gap:5px; }
    .headline-row{ gap:10px; }
    .tab{ padding:7px 13px; font-size:0.86rem; }
    .session-row{ margin-top:-2px; }
    .custom-row{ gap:5px; }
    .custom-field{ padding:6px 9px; }
    .custom-field label{ font-size:9px; }
    .custom-field input{ font-size:0.95rem; }
    .console{ padding:10px 14px; gap:8px; }
    .countdown-section{ gap:6px; }
    .countdown-tile{ padding:12px 22px; border-radius:18px; }
    .phase-name{ font-size:1.15rem; }
    .countdown{ font-size:2.5rem; }
    .session-remaining{ font-size:1.05rem; }
    .controls{ gap:8px; }
    button.primary, button.ghost{ padding:8px 16px; font-size:0.85rem; }
    .sound-hint{ display:none; }
    .best-for{ font-size:0.78rem; }
    .best-for-label{ font-size:0.64rem; }
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <div class="header-top">
      <span class="eyebrow">Guided breathing</span>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to light theme">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" hidden>
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden>
          <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"></path>
        </svg>
      </button>
    </div>
    <div class="headline-row">
      <h1 id="headline">Box Breathing</h1>
      <span class="ratio-badge" id="ratioBadge">4·4·4·4</span>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Breathing pattern">
    <button class="tab" data-pattern="box" role="tab" aria-pressed="true">Box</button>
    <button class="tab" data-pattern="478" role="tab" aria-pressed="false">4-7-8</button>
    <button class="tab" data-pattern="coherent" role="tab" aria-pressed="false">Coherent</button>
    <button class="tab" data-pattern="custom" role="tab" aria-pressed="false">Custom</button>
  </nav>

  <div class="session-row">
    <span class="session-label">Session</span>
    <div class="tabs-sm" role="tablist" aria-label="Session length">
      <button class="tab-sm" data-session="0" role="tab" aria-pressed="true">Continuous</button>
      <button class="tab-sm" data-session="3" role="tab" aria-pressed="false">3 min</button>
      <button class="tab-sm" data-session="5" role="tab" aria-pressed="false">5 min</button>
      <button class="tab-sm" data-session="10" role="tab" aria-pressed="false">10 min</button>
    </div>
  </div>

  <div class="custom-row" id="customRow" hidden>
    <div class="custom-field">
      <label for="inInhale">Inhale, sec</label>
      <input type="number" id="inInhale" min="0" max="60" step="1" value="4">
    </div>
    <div class="custom-field">
      <label for="inHold1">Hold, sec</label>
      <input type="number" id="inHold1" min="0" max="60" step="1" value="4">
    </div>
    <div class="custom-field">
      <label for="inExhale">Exhale, sec</label>
      <input type="number" id="inExhale" min="0" max="60" step="1" value="4">
    </div>
    <div class="custom-field">
      <label for="inHold2">Hold, sec</label>
      <input type="number" id="inHold2" min="0" max="60" step="1" value="4">
    </div>
  </div>

  <section class="console">
    <div class="trace-wrap">
      <svg id="trace" viewBox="0 0 640 110" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Respiration waveform for the current pattern">
        <path class="base-path" id="basePath" d=""></path>
        <clipPath id="revealClip"><rect id="revealRect" x="30" y="0" width="0" height="110"></rect></clipPath>
        <path class="fill-path" id="fillPath" d="" clip-path="url(#revealClip)"></path>
        <line class="now-line" id="nowLine" x1="30" y1="4" x2="30" y2="106"></line>
        <circle class="pulse-ring" id="pulseRing" r="5.5" cx="30" cy="96"></circle>
        <circle class="playhead" id="playhead" r="5.5" cx="30" cy="96"></circle>
      </svg>
    </div>

    <div class="best-for">
      <span class="best-for-label">Best for</span>
      <span class="best-for-text" id="bestFor">staying calm under pressure</span>
    </div>

    <div class="controls">
      <button class="primary" id="startBtn">Start</button>
      <button class="ghost" id="resetBtn">Reset</button>
      <button class="ghost" id="soundBtn" aria-pressed="true">Sound on</button>
      <button class="ghost" id="installBtn" hidden>Install app</button>
      <span class="sound-hint">tone tracks your breath · soft tick marks each second</span>
    </div>

    <div class="countdown-section">
      <div class="countdown-tile"><span class="countdown" id="countdown">4</span></div>
      <span class="phase-name" id="phaseName">Ready</span>
      <div class="time-left-row" id="timeLeftRow" hidden>
        <span class="time-left-label">Time left</span>
        <span class="session-remaining" id="sessionRemaining"></span>
      </div>
    </div>
  </section>
</div>

<script>
(function(){
  var PATTERNS = {
    box: {
      label: "Box Breathing",
      ratio: "4·4·4·4",
      phases: [["Inhale",4],["Hold",4],["Exhale",4],["Hold",4]],
      bestFor: "staying calm under pressure"
    },
    "478": {
      label: "4-7-8 Breathing",
      ratio: "4·7·8",
      phases: [["Inhale",4],["Hold",7],["Exhale",8]],
      bestFor: "falling asleep or calming anxiety"
    },
    coherent: {
      label: "Coherent Breathing",
      ratio: "5·5",
      phases: [["Inhale",5],["Exhale",5]],
      bestFor: "sustained focus"
    },
    custom: {
      label: "Custom Pattern",
      ratio: "",
      phases: [["Inhale",4],["Hold",4],["Exhale",4],["Hold",4]],
      bestFor: "your own rhythm"
    }
  };

  var els = {
    headline: document.getElementById("headline"),
    ratioBadge: document.getElementById("ratioBadge"),
    bestFor: document.getElementById("bestFor"),
    customRow: document.getElementById("customRow"),
    tabs: Array.prototype.slice.call(document.querySelectorAll(".tab")),
    basePath: document.getElementById("basePath"),
    fillPath: document.getElementById("fillPath"),
    revealRect: document.getElementById("revealRect"),
    nowLine: document.getElementById("nowLine"),
    playhead: document.getElementById("playhead"),
    pulseRing: document.getElementById("pulseRing"),
    phaseName: document.getElementById("phaseName"),
    countdown: document.getElementById("countdown"),
    startBtn: document.getElementById("startBtn"),
    resetBtn: document.getElementById("resetBtn"),
    soundBtn: document.getElementById("soundBtn"),
    sessionTabs: Array.prototype.slice.call(document.querySelectorAll(".tab-sm")),
    timeLeftRow: document.getElementById("timeLeftRow"),
    sessionRemaining: document.getElementById("sessionRemaining"),
    inInhale: document.getElementById("inInhale"),
    inHold1: document.getElementById("inHold1"),
    inExhale: document.getElementById("inExhale"),
    inHold2: document.getElementById("inHold2"),
    themeToggle: document.getElementById("themeToggle"),
    iconSun: document.querySelector(".icon-sun"),
    iconMoon: document.querySelector(".icon-moon")
  };

  function phaseClass(name){
    if(name === "Inhale") return "is-inhale";
    if(name === "Exhale") return "is-exhale";
    return "";
  }

  var X0 = 30, X1 = 610, YTOP = 14, YBOTTOM = 96;

  var state = {
    patternKey: "box",
    phases: [],
    boundaries: [],
    points: [],
    total: 0,
    running: false,
    startTs: null,
    elapsedAtPause: 0,
    rafId: null,
    soundOn: true,
    sessionMinutes: 0,
    lastTickSecond: -1,
    oscMain: null,
    oscSub: null,
    oscDetune: null,
    filterNode: null,
    gainNode: null
  };
  var FREQ_LOW = 130, FREQ_HIGH = 164, DRONE_VOLUME = 0.1;

  function loadPrefs(){
    try{
      var raw = localStorage.getItem("respiration-trace-prefs");
      if(!raw) return null;
      return JSON.parse(raw);
    }catch(e){ return null; }
  }
  function savePrefs(){
    try{
      localStorage.setItem("respiration-trace-prefs", JSON.stringify({
        patternKey: state.patternKey,
        custom: [els.inInhale.value, els.inHold1.value, els.inExhale.value, els.inHold2.value],
        soundOn: state.soundOn,
        sessionMinutes: state.sessionMinutes
      }));
    }catch(e){}
  }

  // ---- continuous breath drone ----
  var audioCtx = null;
  function ensureAudio(){
    if(!audioCtx){
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if(!Ctx) return null;
      audioCtx = new Ctx();
    }
    if(audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }
  function ensureDrone(){
    var ctx = ensureAudio();
    if(!ctx || state.oscMain) return;
    var filter = ctx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.value = 1100;
    filter.Q.value = 0.6;
    var master = ctx.createGain();
    master.gain.value = 0.0001;
    filter.connect(master).connect(ctx.destination);

    function voice(type, gainVal){
      var osc = ctx.createOscillator();
      var g = ctx.createGain();
      osc.type = type;
      g.gain.value = gainVal;
      osc.connect(g).connect(filter);
      osc.start();
      return osc;
    }
    state.oscMain = voice("sine", 0.55);
    state.oscSub = voice("sine", 0.32);
    state.oscDetune = voice("triangle", 0.16);
    state.filterNode = filter;
    state.gainNode = master;
  }
  function setDroneVolume(target, rampSeconds){
    if(!state.gainNode || !audioCtx) return;
    var now = audioCtx.currentTime;
    state.gainNode.gain.cancelScheduledValues(now);
    state.gainNode.gain.setValueAtTime(Math.max(0.0001, state.gainNode.gain.value), now);
    state.gainNode.gain.linearRampToValueAtTime(Math.max(0.0001, target), now + rampSeconds);
  }
  function stopDrone(){
    [state.oscMain, state.oscSub, state.oscDetune].forEach(function(osc){
      if(!osc) return;
      try{ osc.stop(); }catch(e){}
      osc.disconnect();
    });
    if(state.filterNode) state.filterNode.disconnect();
    if(state.gainNode) state.gainNode.disconnect();
    state.oscMain = state.oscSub = state.oscDetune = state.filterNode = state.gainNode = null;
  }
  function updateDroneFrequency(level){
    if(!state.oscMain) return;
    var t = audioCtx.currentTime;
    var freq = FREQ_LOW + level * (FREQ_HIGH - FREQ_LOW);
    state.oscMain.frequency.setValueAtTime(freq, t);
    state.oscSub.frequency.setValueAtTime(freq / 2, t);
    state.oscDetune.frequency.setValueAtTime(freq * 1.0045, t);
  }
  function playTick(){
    if(!state.soundOn) return;
    var ctx = ensureAudio();
    if(!ctx) return;
    var t0 = ctx.currentTime;
    var osc = ctx.createOscillator();
    var filt = ctx.createBiquadFilter();
    var g = ctx.createGain();
    var even = state.lastTickSecond % 2 === 0;
    osc.type = "sine";
    osc.frequency.value = even ? 700 : 560;
    filt.type = "lowpass";
    filt.frequency.value = 1600;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(0.045, t0 + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.09);
    osc.connect(filt).connect(g).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + 0.12);
    pulseTick(even);
  }
  function pulseTick(even){
    els.pulseRing.style.stroke = even ? "var(--accent)" : "var(--accent-strong)";
    els.pulseRing.classList.remove("active");
    els.countdown.classList.remove("pulse");
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        els.pulseRing.classList.add("active");
        els.countdown.classList.add("pulse");
      });
    });
  }

  function getRawPhases(key){
    if(key === "custom"){
      return [
        ["Inhale", clampNum(els.inInhale.value)],
        ["Hold", clampNum(els.inHold1.value)],
        ["Exhale", clampNum(els.inExhale.value)],
        ["Hold", clampNum(els.inHold2.value)]
      ];
    }
    return PATTERNS[key].phases;
  }
  function clampNum(v){
    var n = parseInt(v, 10);
    if(isNaN(n) || n < 0) n = 0;
    if(n > 60) n = 60;
    return n;
  }

  function buildGeometry(key){
    var raw = getRawPhases(key).filter(function(p){ return p[1] > 0; });
    if(raw.length === 0){ raw = [["Inhale",1]]; }
    var total = raw.reduce(function(s,p){ return s + p[1]; }, 0);

    var level = 0;
    var boundaries = [0];
    var points = [{x:X0, y:yFor(0)}];
    var cum = 0;
    raw.forEach(function(p){
      var name = p[0], dur = p[1];
      var target = level;
      if(name === "Inhale") target = 1;
      else if(name === "Exhale") target = 0;
      cum += dur;
      boundaries.push(cum);
      points.push({x: X0 + (cum/total)*(X1-X0), y: yFor(target)});
      level = target;
    });

    state.phases = raw;
    state.boundaries = boundaries;
    state.points = points;
    state.total = total;
  }

  function yFor(level){ return YBOTTOM - level*(YBOTTOM-YTOP); }

  function formatTime(seconds){
    var s = Math.max(0, Math.ceil(seconds));
    var m = Math.floor(s / 60);
    var r = s % 60;
    return m + ":" + (r < 10 ? "0" : "") + r;
  }

  function pathFromPoints(points){
    return points.map(function(pt,i){ return (i===0?"M":"L") + pt.x.toFixed(2) + "," + pt.y.toFixed(2); }).join(" ");
  }

  function drawStatic(){
    var d = pathFromPoints(state.points);
    els.basePath.setAttribute("d", d);
    var fillPts = state.points.slice();
    var closed = d + " L" + fillPts[fillPts.length-1].x.toFixed(2) + "," + YBOTTOM + " L" + fillPts[0].x.toFixed(2) + "," + YBOTTOM + " Z";
    els.fillPath.setAttribute("d", closed);
  }

  function posAtTime(t){
    for(var i=0;i<state.phases.length;i++){
      var segStart = state.boundaries[i], segEnd = state.boundaries[i+1];
      if(t <= segEnd || i === state.phases.length-1){
        var frac = segEnd > segStart ? (t-segStart)/(segEnd-segStart) : 1;
        frac = Math.max(0, Math.min(1, frac));
        var p0 = state.points[i], p1 = state.points[i+1];
        return {
          x: p0.x + (p1.x-p0.x)*frac,
          y: p0.y + (p1.y-p0.y)*frac,
          phaseIndex: i,
          secondsLeft: Math.max(0, Math.ceil(segEnd - t))
        };
      }
    }
    return { x: state.points[0].x, y: state.points[0].y, phaseIndex: 0, secondsLeft: state.phases[0][1] };
  }

  function renderAt(elapsed){
    var t = elapsed % state.total;
    var pos = posAtTime(t);

    els.playhead.setAttribute("cx", pos.x.toFixed(2));
    els.playhead.setAttribute("cy", pos.y.toFixed(2));
    els.pulseRing.setAttribute("cx", pos.x.toFixed(2));
    els.pulseRing.setAttribute("cy", pos.y.toFixed(2));
    els.nowLine.setAttribute("x1", pos.x.toFixed(2));
    els.nowLine.setAttribute("x2", pos.x.toFixed(2));
    els.revealRect.setAttribute("width", Math.max(0, pos.x - X0).toFixed(2));

    var phName = state.phases[pos.phaseIndex][0];
    els.phaseName.textContent = phName;
    els.phaseName.className = "phase-name " + phaseClass(phName);
    els.countdown.textContent = pos.secondsLeft;

    if(state.sessionMinutes > 0){
      els.timeLeftRow.hidden = false;
      els.sessionRemaining.textContent = formatTime(state.sessionMinutes*60 - elapsed);
    }

    var level = (YBOTTOM - pos.y) / (YBOTTOM - YTOP);
    updateDroneFrequency(level);
  }

  function renderReady(){
    var pos = { x: state.points[0].x, y: state.points[0].y };
    els.playhead.setAttribute("cx", pos.x); els.playhead.setAttribute("cy", pos.y);
    els.pulseRing.setAttribute("cx", pos.x); els.pulseRing.setAttribute("cy", pos.y);
    els.pulseRing.classList.remove("active");
    els.nowLine.setAttribute("x1", pos.x); els.nowLine.setAttribute("x2", pos.x);
    els.revealRect.setAttribute("width", 0);
    els.phaseName.textContent = state.phases[0][0];
    els.phaseName.className = "phase-name " + phaseClass(state.phases[0][0]);
    els.countdown.textContent = state.phases[0][1];
    if(state.sessionMinutes > 0){
      els.timeLeftRow.hidden = false;
      els.sessionRemaining.textContent = formatTime(state.sessionMinutes*60);
    } else {
      els.timeLeftRow.hidden = true;
    }
  }

  function finishSession(){
    cancelAnimationFrame(state.rafId);
    state.running = false;
    setDroneVolume(0, 1.4);
    setTimeout(stopDrone, 1500);
    els.startBtn.textContent = "Start";
    els.phaseName.textContent = "Complete";
    els.phaseName.className = "phase-name";
    els.countdown.textContent = "–";
    els.sessionRemaining.textContent = "0:00";
  }

  function tick(now){
    if(!state.running) return;
    var elapsed = state.elapsedAtPause + (now - state.startTs)/1000;
    if(state.sessionMinutes > 0 && elapsed >= state.sessionMinutes*60){
      finishSession();
      return;
    }
    var wholeSecond = Math.floor(elapsed);
    if(wholeSecond !== state.lastTickSecond){
      state.lastTickSecond = wholeSecond;
      playTick();
    }
    renderAt(elapsed);
    state.rafId = requestAnimationFrame(tick);
  }

  function start(){
    if(state.running) return;
    if(state.soundOn){
      ensureDrone();
      setDroneVolume(DRONE_VOLUME, 0.5);
    }
    state.running = true;
    state.startTs = performance.now();
    els.startBtn.textContent = "Pause";
    state.rafId = requestAnimationFrame(tick);
  }
  function pause(){
    if(!state.running) return;
    state.elapsedAtPause += (performance.now() - state.startTs)/1000;
    state.running = false;
    els.startBtn.textContent = "Resume";
    cancelAnimationFrame(state.rafId);
    setDroneVolume(0, 0.25);
  }
  function reset(){
    state.running = false;
    state.elapsedAtPause = 0;
    state.lastTickSecond = -1;
    cancelAnimationFrame(state.rafId);
    els.startBtn.textContent = "Start";
    stopDrone();
    renderReady();
  }

  function selectPattern(key){
    state.patternKey = key;
    els.tabs.forEach(function(t){
      var active = t.dataset.pattern === key;
      t.setAttribute("aria-pressed", active ? "true" : "false");
      if(active) t.scrollIntoView({inline:"center", block:"nearest", behavior:"smooth"});
    });
    els.customRow.hidden = key !== "custom";
    var meta = PATTERNS[key];
    els.headline.textContent = meta.label;
    buildGeometry(key);
    if(key === "custom"){
      els.ratioBadge.textContent = state.phases.map(function(p){return p[1];}).join("·");
    } else {
      els.ratioBadge.textContent = meta.ratio;
    }
    els.bestFor.textContent = meta.bestFor;
    drawStatic();
    reset();
    savePrefs();
  }

  els.tabs.forEach(function(btn){
    btn.addEventListener("click", function(){ selectPattern(btn.dataset.pattern); });
  });
  [els.inInhale, els.inHold1, els.inExhale, els.inHold2].forEach(function(input){
    input.addEventListener("input", function(){
      if(state.patternKey === "custom"){
        buildGeometry("custom");
        els.ratioBadge.textContent = state.phases.map(function(p){return p[1];}).join("·");
        drawStatic();
        reset();
        savePrefs();
      }
    });
  });
  els.startBtn.addEventListener("click", function(){
    if(state.running) pause(); else start();
  });
  els.resetBtn.addEventListener("click", reset);
  els.sessionTabs.forEach(function(btn){
    btn.addEventListener("click", function(){
      state.sessionMinutes = Number(btn.dataset.session);
      els.sessionTabs.forEach(function(t){ t.setAttribute("aria-pressed", t === btn ? "true" : "false"); });
      btn.scrollIntoView({inline:"center", block:"nearest", behavior:"smooth"});
      reset();
      savePrefs();
    });
  });
  els.soundBtn.addEventListener("click", function(){
    state.soundOn = !state.soundOn;
    els.soundBtn.setAttribute("aria-pressed", state.soundOn ? "true" : "false");
    els.soundBtn.textContent = state.soundOn ? "Sound on" : "Sound off";
    if(state.running){
      if(state.soundOn){ ensureDrone(); setDroneVolume(DRONE_VOLUME, 0.3); }
      else { setDroneVolume(0, 0.15); }
    }
    savePrefs();
  });

  // ---- theme toggle ----
  function getStoredTheme(){
    try{ return localStorage.getItem("respiration-trace-theme"); }catch(e){ return null; }
  }
  function systemPrefersDark(){
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  function effectiveTheme(){
    var stored = getStoredTheme();
    if(stored === "light" || stored === "dark") return stored;
    return systemPrefersDark() ? "dark" : "light";
  }
  function setSvgHidden(el, isHidden){
    if(isHidden) el.setAttribute("hidden", ""); else el.removeAttribute("hidden");
  }
  function updateThemeToggleIcon(){
    var isDark = effectiveTheme() === "dark";
    setSvgHidden(els.iconSun, !isDark);
    setSvgHidden(els.iconMoon, isDark);
    els.themeToggle.setAttribute("aria-label", isDark ? "Switch to light theme" : "Switch to dark theme");
  }
  els.themeToggle.addEventListener("click", function(){
    var next = effectiveTheme() === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try{ localStorage.setItem("respiration-trace-theme", next); }catch(e){}
    updateThemeToggleIcon();
  });
  var storedTheme = getStoredTheme();
  if(storedTheme === "light" || storedTheme === "dark"){
    document.documentElement.setAttribute("data-theme", storedTheme);
  }
  updateThemeToggleIcon();

  // init
  var prefs = loadPrefs();
  var initKey = "box";
  if(prefs && PATTERNS[prefs.patternKey]) initKey = prefs.patternKey;
  if(prefs && prefs.custom){
    els.inInhale.value = prefs.custom[0];
    els.inHold1.value = prefs.custom[1];
    els.inExhale.value = prefs.custom[2];
    els.inHold2.value = prefs.custom[3];
  }
  if(prefs && typeof prefs.soundOn === "boolean"){
    state.soundOn = prefs.soundOn;
    els.soundBtn.setAttribute("aria-pressed", state.soundOn ? "true" : "false");
    els.soundBtn.textContent = state.soundOn ? "Sound on" : "Sound off";
  }
  if(prefs && typeof prefs.sessionMinutes === "number"){
    state.sessionMinutes = prefs.sessionMinutes;
    els.sessionTabs.forEach(function(t){
      t.setAttribute("aria-pressed", Number(t.dataset.session) === state.sessionMinutes ? "true" : "false");
    });
  }
  selectPattern(initKey);

  // ---- install as app ----
  var installBtn = document.getElementById("installBtn");
  var deferredPrompt = null;
  window.addEventListener("beforeinstallprompt", function(e){
    // Don't preventDefault: let the browser show its own automatic
    // install banner (e.g. Chrome on Android). We still keep a
    // reference so our own button works as a manual fallback,
    // useful on desktop where there's no automatic banner.
    deferredPrompt = e;
    installBtn.hidden = false;
  });
  installBtn.addEventListener("click", function(){
    if(!deferredPrompt) return;
    installBtn.hidden = true;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function(){ deferredPrompt = null; });
  });
  window.addEventListener("appinstalled", function(){ installBtn.hidden = true; });

  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("service-worker.js").catch(function(){});
    });
  }
})();
</script>
</body>
</html>
